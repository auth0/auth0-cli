name: Main Workflow

on:
  pull_request: {}
  push:
    branches: [ "main", "beta" ]


# Runs of different pull requests, and of pushes to the branches, do not wait for
# each other. On one pull request a run that has started is never cancelled, because
# it may be in the middle of the integration tests, which change a live tenant. A new
# commit waits behind it and replaces the commit that was waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check that docs were generated
        run: make check-docs

      - name: Check for linting errors
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: "goinstall"
          version: latest
          args: -v -c .golangci.yml

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run unit tests
        run: make test-unit

      - name: Upload unit test coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-tests-artifact
          path: ./coverage-unit-tests.out

  windows-tests:
    name: Plugin Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run plugin library tests
        run: go test -count=1 ./internal/plugins/...

      - name: Run plugin command tests
        if: ${{ !cancelled() }}
        run: go test -count=1 -run 'Plugin|Approvals|Commands|InterruptGuard|OwnedFlags|NamespaceJSONHelp|RegistryNextAction' ./internal/cli

      - name: Run plugin library tests with the test registry key
        if: ${{ !cancelled() }}
        run: go test -count=1 -tags plugintest ./internal/plugins/...

      - name: Run plugin command tests with the test registry key
        if: ${{ !cancelled() }}
        run: go test -count=1 -tags plugintest -run 'Plugin|Approvals|Commands|InterruptGuard|OwnedFlags|NamespaceJSONHelp|RegistryNextAction' ./internal/cli

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    # The tests change resources of a live tenant, so only one run at a time may use it.
    # A run that has started is never cancelled, and the next one waits for its turn.
    concurrency:
      group: live-tenant
      cancel-in-progress: false

    # Skip running if the PR is coming from a fork or is created by dependabot or snyk due to missing repo secrets.
    # Only run on pushes to main or PRs targeting main.
    if: github.event.pull_request.head.repo.fork == false && (github.actor != 'dependabot[bot]' && github.actor != 'snyk-bot') &&
        (github.ref == 'refs/heads/main' || github.base_ref == 'main')

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run integration tests
        shell: bash
        run: make test-integration
        env:
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}

      - name: Download unit test coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unit-tests-artifact
          path: ./unit-tests-artifact

      - name: Update codecov report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./unit-tests-artifact/coverage-unit-tests.out,./coverage-integration-tests.out
          fail_ci_if_error: false
          verbose: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Ensure binaries can be built for all platforms
        run: make build-all-platforms
