name: Security

on:
  pull_request: {}
  push:
    branches: [ "main", "beta" ]
  schedule:
    - cron: "30 0 1,15 * *"

permissions:
  contents: read

jobs:
  govulncheck:
    name: Vulnerabilities Scan
    runs-on: ubuntu-latest
    steps:
      - name: Scan for vulnerabilities in go code
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          check-latest: true
