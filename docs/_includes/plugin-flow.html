<div class="plugin-flow" markdown="0" tabindex="0" role="group" aria-label="Plugin flow diagram. Focus here to use the keyboard shortcuts.">
<style>
.plugin-flow {
  --bg: #fff;
  --surface: #fff;
  --surface-2: #f5f6fa;
  --text: #27262b;
  --muted: #5c5962;
  --border: #e6e1e8;
  --line: #959396;
  --accent: #5e41d0;
  --accent-bg: #f1eefd;
  --focus: #7253ed;
  --danger: #dd2e2e;
  --danger-bg: #fceaea;
  --ease: ease-in-out;
  --font: system-ui, -apple-system, blinkmacsystemfont, "Segoe UI", roboto, "Helvetica Neue", arial, sans-serif;
  --mono: "SFMono-Regular", menlo, consolas, monospace;
  margin: 1.5em 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.5;
}
.plugin-flow,
.plugin-flow * {
  box-sizing: border-box;
}
.plugin-flow code,
.plugin-flow pre,
.plugin-flow .mono {
  font-family: var(--mono);
}
.plugin-flow code {
  background: var(--surface-2);
  border: 1px solid var(--border);
  padding: .2em .15em;
  border-radius: 4px;
  font-size: .85em;
  font-weight: 400;
  overflow-wrap: anywhere;
}
.plugin-flow kbd {
  font-family: inherit;
  font-size: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 0 5px;
}
.plugin-flow .bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.plugin-flow .bar .field {
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 100%;
}
.plugin-flow .bar .field.scenario {
  flex: 1 1 300px;
  min-width: 0;
}
.plugin-flow .bar .field.scenario select {
  flex: 1 1 auto;
  min-width: 0;
}
.plugin-flow .bar label {
  font-size: 13px;
  color: var(--muted);
}
.plugin-flow select,
.plugin-flow button {
  font: inherit;
  font-size: 14px;
  color: var(--text);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
}
.plugin-flow select {
  max-width: 100%;
}
.plugin-flow button:hover:not(:disabled),
.plugin-flow select:hover {
  border-color: var(--accent);
}
.plugin-flow button:disabled {
  opacity: .45;
  cursor: not-allowed;
}
.plugin-flow button.primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
  min-width: 96px;
}
.plugin-flow :focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}
.plugin-flow .btns {
  display: flex;
  gap: 8px;
}
.plugin-flow .dots {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  flex: 1 1 300px;
  min-width: 0;
}
.plugin-flow .dots button.dot {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 0;
  background: transparent;
}
.plugin-flow .dots button.dot::before {
  content: "";
  width: 10px;
  height: 10px;
  border: 2px solid var(--line);
  border-radius: 50%;
  background: var(--surface);
  transition: background .2s var(--ease), border-color .2s var(--ease);
}
.plugin-flow .dots button.dot:hover::before {
  border-color: var(--accent);
}
.plugin-flow .dots button.dot.done::before {
  background: var(--accent);
  border-color: var(--accent);
}
.plugin-flow .dots button.dot.current::before {
  width: 16px;
  height: 16px;
  border: 3px solid var(--accent);
  background: var(--accent-bg);
}
.plugin-flow .dots button.dot.failed::before {
  background: var(--danger);
  border-color: var(--danger);
}
.plugin-flow .dots button.dot.failed.current::before {
  background: var(--danger-bg);
}
.plugin-flow .summary {
  margin: 10px 2px 10px;
  font-size: 14px;
  color: var(--muted);
}
.plugin-flow .stage {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  min-width: 0;
}
.plugin-flow svg#plugin-flow-diagram {
  width: 100%;
  height: auto;
  display: block;
}
.plugin-flow .zone rect {
  fill: var(--surface-2);
  stroke: var(--border);
  stroke-width: 1;
}
.plugin-flow .zone text {
  fill: var(--muted);
  font-size: 14px;
  font-weight: 600;
}
.plugin-flow .edge {
  fill: none;
  stroke: var(--line);
  stroke-width: 1.5;
}
.plugin-flow .edge-active {
  fill: none;
  stroke: var(--accent);
  stroke-width: 3;
  stroke-linejoin: round;
}
.plugin-flow .edge-active.bad {
  stroke: var(--danger);
}
.plugin-flow .edge-active.draw {
  stroke-dasharray: var(--len);
  stroke-dashoffset: var(--len);
  animation: plugin-flow-draw 400ms var(--ease) forwards;
}
.plugin-flow .arrow-head {
  fill: var(--accent);
}
.plugin-flow .arrow-head.bad {
  fill: var(--danger);
}
.plugin-flow .arrow-head.anim {
  opacity: 0;
  animation: plugin-flow-fade 150ms var(--ease) forwards;
}
.plugin-flow .packet {
  fill: var(--accent);
  stroke: var(--surface);
  stroke-width: 2;
}
.plugin-flow .packet.bad {
  fill: var(--danger);
}
.plugin-flow .node .box {
  fill: var(--surface);
  stroke: var(--line);
  stroke-width: 1.5;
}
.plugin-flow .node .halo {
  fill: none;
  stroke: var(--accent);
  stroke-width: 5;
  opacity: 0;
}
.plugin-flow .node.target .halo {
  animation: plugin-flow-pulse 1.6s var(--ease) infinite;
}
.plugin-flow .node.active .box {
  stroke: var(--accent);
  stroke-width: 3;
}
.plugin-flow .node.active:not(.container) .box {
  fill: var(--accent-bg);
}
.plugin-flow .node.fail .box {
  stroke: var(--danger);
  stroke-width: 4;
}
.plugin-flow .node.fail:not(.container) .box {
  fill: var(--danger-bg);
}
.plugin-flow .node.fail .halo {
  stroke: var(--danger);
}
.plugin-flow .node .name {
  fill: var(--text);
  font-size: 15px;
  font-weight: 650;
}
.plugin-flow .node.container .name {
  font-size: 16px;
}
.plugin-flow .node.fail .name {
  fill: var(--danger);
}
.plugin-flow .node .sub {
  fill: var(--muted);
  font-size: 14px;
}
.plugin-flow .node .badge rect {
  fill: var(--surface);
  stroke: var(--line);
  stroke-width: 1;
}
.plugin-flow .node .badge text {
  fill: var(--muted);
  font-size: 14px;
}
.plugin-flow .node .badge-x {
  display: none;
}
.plugin-flow .node.fail .badge-x {
  display: block;
}
.plugin-flow .node .badge-x circle {
  fill: var(--danger);
  stroke: var(--surface);
  stroke-width: 2;
}
.plugin-flow .node .badge-x text {
  fill: #fff;
  font-size: 14px;
  font-weight: 800;
}
.plugin-flow .node .check text {
  font-size: 14px;
  fill: var(--muted);
}
.plugin-flow .node .check .mark {
  font-weight: 800;
}
.plugin-flow .node .check.done .mark {
  fill: var(--accent);
}
.plugin-flow .node .check.current .row {
  fill: var(--accent-bg);
}
.plugin-flow .node .check.current .mark,
.plugin-flow .node .check.current .ctext {
  fill: var(--accent);
  font-weight: 700;
}
.plugin-flow .node .check.fail .row {
  fill: var(--danger-bg);
}
.plugin-flow .node .check.fail .mark,
.plugin-flow .node .check.fail .ctext {
  fill: var(--danger);
  font-weight: 700;
}
.plugin-flow .node .check.todo .ctext,
.plugin-flow .node .check.todo .mark {
  fill: var(--muted);
}
.plugin-flow .wire rect {
  fill: var(--surface);
  stroke: var(--border);
  stroke-width: 1;
}
.plugin-flow .wire text {
  fill: var(--text);
  font-size: 14px;
}
@keyframes plugin-flow-draw {
  to {
    stroke-dashoffset: 0;
  }
}
@keyframes plugin-flow-fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes plugin-flow-pulse {
  0%,
  100% {
    opacity: .1;
  }
  50% {
    opacity: .55;
  }
}
.plugin-flow .caption {
  margin-top: 14px;
  padding: 0 2px;
}
.plugin-flow .cap-meta {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
}
.plugin-flow .cap-status {
  font-weight: 700;
  color: var(--accent);
}
.plugin-flow .cap-status.fail,
.plugin-flow .cap-status.denied {
  color: var(--danger);
}
.plugin-flow .cap-status.info {
  color: var(--muted);
}
.plugin-flow .caption h3 {
  font-size: 18px;
  font-weight: 650;
  line-height: 1.3;
  margin: 4px 0 6px;
  color: var(--text);
}
.plugin-flow .caption p {
  margin: 0 0 12px;
}
.plugin-flow .protected {
  border-left: 4px solid var(--danger);
  background: var(--danger-bg);
  padding: 8px 12px;
  border-radius: 0 8px 8px 0;
  font-size: 14px;
  margin-bottom: 12px;
}
.plugin-flow .protected .never {
  margin-top: 4px;
  color: var(--muted);
}
.plugin-flow .databox {
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 13px;
}
.plugin-flow .dlabel {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 0 0 2px;
}
.plugin-flow .dlines {
  border-left: 3px solid var(--border);
  padding: 2px 0 2px 10px;
  font-size: 13px;
}
.plugin-flow .dlines .l {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-family: var(--mono);
  padding: 1px 0;
}
.plugin-flow .l .m {
  display: inline-block;
  width: 1.6em;
  font-weight: 800;
}
.plugin-flow .l.ok .m {
  color: var(--accent);
}
.plugin-flow .l.no,
.plugin-flow .l.no .m {
  color: var(--danger);
}
.plugin-flow .l.del {
  color: var(--danger);
  text-decoration: line-through;
}
.plugin-flow .l.add {
  color: var(--accent);
}
.plugin-flow .l.hl {
  font-weight: 700;
  color: var(--text);
}
.plugin-flow .l.note {
  font-family: var(--font);
  font-style: italic;
  padding-top: 4px;
}
.plugin-flow .hint {
  font-size: 13px;
  color: var(--muted);
  margin: 12px 2px 0;
}
.plugin-flow.still * {
  transition: none !important;
  animation: none !important;
}
@media (prefers-reduced-motion: reduce) {
  .plugin-flow * {
    transition: none !important;
    animation: none !important;
  }
  .plugin-flow .edge-active.draw {
    stroke-dasharray: none;
    stroke-dashoffset: 0;
  }
  .plugin-flow .arrow-head.anim {
    opacity: 1;
  }
}
.plugin-flow.still .edge-active.draw {
  stroke-dasharray: none;
  stroke-dashoffset: 0;
}
.plugin-flow.still .arrow-head.anim {
  opacity: 1;
}
</style>
<noscript>
  <p>This page needs JavaScript to run the simulation.</p>
</noscript>
  <div class="bar" role="group" aria-label="Playback controls">
    <div class="field scenario">
      <label for="plugin-flow-scenario">Scenario</label>
      <select id="plugin-flow-scenario"></select>
    </div>
    <div class="btns">
      <button id="plugin-flow-prev" type="button"><span aria-hidden="true">&larr;</span> Back</button>
      <button id="plugin-flow-play" type="button" class="primary">&#9654; Play</button>
      <button id="plugin-flow-next" type="button">Next <span aria-hidden="true">&rarr;</span></button>
    </div>
    <div class="dots" id="plugin-flow-dots" role="group" aria-label="Steps"></div>
    <div class="field">
      <label for="plugin-flow-speed">Speed</label>
      <select id="plugin-flow-speed">
        <option value="0.5">0.5x</option>
        <option value="1" selected>1x</option>
        <option value="2">2x</option>
      </select>
    </div>
  </div>
  <p class="summary" id="plugin-flow-summary"></p>
  <div class="stage">
    <svg id="plugin-flow-diagram" viewBox="0 0 800 340" role="img"
      aria-label="Diagram of the components in this step. The words for the step are in the text below the diagram.">
      <g id="plugin-flow-g-zones"></g>
      <g id="plugin-flow-g-edges"></g>
      <g id="plugin-flow-g-nodes"></g>
      <g id="plugin-flow-g-wire"></g>
      <g id="plugin-flow-g-packet"></g>
    </svg>
  </div>
  <section class="caption" id="plugin-flow-panel" aria-live="polite" aria-atomic="true" aria-label="Step details">
    <div class="cap-meta"><span id="plugin-flow-p-count"></span><span id="plugin-flow-p-status" class="cap-status"></span></div>
    <h3 id="plugin-flow-p-title"></h3>
    <p id="plugin-flow-p-text"></p>
    <div id="plugin-flow-p-protected"></div>
    <div id="plugin-flow-p-data"></div>
  </section>
  <p class="hint">Keyboard: <kbd>&rarr;</kbd> next, <kbd>&larr;</kbd> previous, <kbd>Space</kbd> play or pause,
    <kbd>R</kbd> restart. Play stops by itself at the last step.
  </p>
<script src="{{ '/assets/js/plugin-flow.js' | relative_url }}"></script>

</div>
