config:
  inherit-env: true
  retries: 1

tests:
  001 - it successfully lists all connections (json):
    command: auth0 connections list --json
    exit-code: 0

  002 - it successfully creates a connection via flags:
    command: auth0 connections create --name integration-test-connection-created --strategy auth0 --no-input
    exit-code: 0
    stdout:
      contains:
        - ID
        - NAME
        - integration-test-connection-created

  003 - it successfully creates a connection and outputs in json:
    command: auth0 connections create --name integration-test-connection-json --strategy auth0 --no-input --json
    exit-code: 0
    stdout:
      json:
        name: "integration-test-connection-json"
        strategy: "auth0"

  004 - it successfully creates a connection from inline data:
    command: auth0 connections create --data '{"name":"integration-test-connection-data","strategy":"auth0"}' --no-input --json
    exit-code: 0
    stdout:
      json:
        name: "integration-test-connection-data"
        strategy: "auth0"

  005 - it fails to create a connection from invalid json:
    command: echo 'not-json' | auth0 connections create --no-input
    exit-code: 1
    stderr:
      contains:
        - Invalid JSON

  006 - it successfully lists all connections with data:
    command: auth0 connections list
    exit-code: 0
    stdout:
      contains:
        - ID
        - NAME
        - STRATEGY
        - REALMS

  007 - it successfully filters connections with a query:
    command: auth0 connections list --query '{"strategy":["auth0"]}'
    exit-code: 0

  008 - it successfully prints the create schema:
    command: auth0 connections create --schema
    exit-code: 0
    stdout:
      contains:
        - strategy

  009 - given a test connection, it successfully shows the connection details:
    command: auth0 connections show $(./test/integration/scripts/get-connection-id.sh)
    exit-code: 0
    stdout:
      contains:
        - ID
        - NAME
        - integration-test-connection

  010 - given a test connection, it successfully shows the connection details (json):
    command: auth0 connections show $(./test/integration/scripts/get-connection-id.sh) --json
    exit-code: 0
    stdout:
      json:
        name: "integration-test-connection"
        strategy: "auth0"

  011 - given a test connection, it successfully updates the connection from inline data:
    command: auth0 connections update $(./test/integration/scripts/get-connection-id.sh) --data '{"display_name":"integration-test-connection-updated"}' --json
    exit-code: 0
    stdout:
      json:
        display_name: "integration-test-connection-updated"

  012 - given a test connection, it successfully shows the enabled clients:
    command: auth0 connections enabled-clients show $(./test/integration/scripts/get-connection-id.sh)
    exit-code: 0

  013 - it successfully prints the enabled-clients update schema:
    command: auth0 connections enabled-clients update --schema
    exit-code: 0
    stdout:
      contains:
        - client_id
        - status

  014 - it fails to update enabled clients without data non-interactively:
    command: auth0 connections enabled-clients update $(./test/integration/scripts/get-connection-id.sh) --no-input
    exit-code: 1
    stderr:
      contains:
        - client statuses provided

  015 - agent mode refuses to delete a connection without force:
    command: AUTH0_AGENT_MODE=true auth0 connections delete $(./test/integration/scripts/get-connection-id.sh)
    exit-code: 1
    stderr:
      contains:
        - destructive command
        - --force

  016 - given a test connection, it successfully deletes the connection:
    command: auth0 connections delete $(./test/integration/scripts/get-connection-id.sh) --force
    exit-code: 0

  017 - it cleans up all connections created by this suite:
    command: ./test/integration/scripts/cleanup-connections.sh
    exit-code: 0
