config:
  inherit-env: true
  retries: 1
  interval: 1s

tests:
  001 - list client grants:
    command: auth0 client-grants list
    exit-code: 0

  002 - list client grants with invalid number:
    command: auth0 client-grants list --number 1001
    exit-code: 1
    stderr:
      contains:
        - Number flag invalid, please pass a number between 1 and 1000

  002a - list client grants rejects json and csv together:
    command: auth0 client-grants list --json --csv
    exit-code: 1
    stderr:
      contains:
        - "any flags in the group [json json-compact csv] are set none of the others can be"

  003 - create client grant with specific scopes and check json output:
    command: auth0 client-grants create --client-id $(./test/integration/scripts/get-m2m-app-id.sh) --audience $(./test/integration/scripts/get-api-identifier.sh) --scopes read:todos --json --no-input
    exit-code: 0
    stdout:
      json:
        audience: http://integration-test-api-client-grant
        scope: "[read:todos]"

  003a - create client grant rejects a scope not defined on the API:
    command: auth0 client-grants create --client-id $(./test/integration/scripts/get-m2m-app-id.sh) --audience $(./test/integration/scripts/get-api-identifier.sh) --scopes read:nonexistent --no-input
    exit-code: 1
    stderr:
      contains:
        - "are not defined on the API"

  004 - create client grant that already exists should fail:
    command: auth0 client-grants create --client-id $(./test/integration/scripts/get-m2m-app-id.sh) --audience $(./test/integration/scripts/get-api-identifier.sh) --scopes read:todos --no-input
    exit-code: 1

  005 - create client grant with allow-any-organization on deny usage should fail:
    command: auth0 client-grants create --client-id $(./test/integration/scripts/get-m2m-app-id.sh) --audience $(./test/integration/scripts/get-api-identifier.sh) --allow-all-scopes --organization-usage deny --allow-any-organization=true --no-input
    exit-code: 1
    stderr:
      contains:
        - "--allow-any-organization can only be enabled when --organization-usage is 'allow' or 'require'"

  006 - create client grant with user subject type and organization usage should fail:
    command: auth0 client-grants create --client-id $(./test/integration/scripts/get-m2m-app-id.sh) --audience $(./test/integration/scripts/get-api-identifier.sh) --subject-type user --organization-usage allow --no-input
    exit-code: 1
    stderr:
      contains:
        - "cannot be set when --subject-type is"

  007 - show client grant json output:
    command: auth0 client-grants show $(./test/integration/scripts/get-client-grant-id.sh) --json --no-input
    exit-code: 0
    stdout:
      json:
        audience: http://integration-test-api-client-grant
        scope: "[read:todos]"

  008 - show client grant table output:
    command: auth0 client-grants show $(./test/integration/scripts/get-client-grant-id.sh) --no-input
    exit-code: 0
    stdout:
      contains:
        - AUDIENCE      http://integration-test-api-client-grant
        - SCOPES        read:todos

  009 - show client grant with invalid id:
    command: auth0 client-grants show this-client-grant-id-does-not-exist --no-input
    exit-code: 1
    stderr:
      contains:
        - "Failed to read client grant with ID \"this-client-grant-id-does-not-exist\""

  010 - update client grant scopes json output:
    command: auth0 client-grants update $(./test/integration/scripts/get-client-grant-id.sh) --scopes read:todos,write:todos --json --no-input
    exit-code: 0
    stdout:
      json:
        scope: "[read:todos write:todos]"

  011 - update client grant to allow all scopes:
    command: auth0 client-grants update $(./test/integration/scripts/get-client-grant-id.sh) --allow-all-scopes --json --no-input
    exit-code: 0
    stdout:
      json:
        allow_all_scopes: "true"

  012 - update client grant organization settings:
    command: auth0 client-grants update $(./test/integration/scripts/get-client-grant-id.sh) --organization-usage allow --allow-any-organization=true --json --no-input
    exit-code: 0
    stdout:
      json:
        organization_usage: allow
        allow_any_organization: "true"

  013 - update client grant back to specific scopes clears allow all scopes:
    command: auth0 client-grants update $(./test/integration/scripts/get-client-grant-id.sh) --scopes read:todos --json --no-input
    exit-code: 0
    stdout:
      json:
        scope: "[read:todos]"

  013a - update client grant rejects a scope not defined on the API:
    command: auth0 client-grants update $(./test/integration/scripts/get-client-grant-id.sh) --scopes read:nonexistent --no-input
    exit-code: 1
    stderr:
      contains:
        - "are not defined on the API"

  013b - update client grant with no-scopes clears scopes:
    command: auth0 client-grants update $(./test/integration/scripts/get-client-grant-id.sh) --no-scopes --json --no-input
    exit-code: 0
    stdout:
      json:
        audience: http://integration-test-api-client-grant
      not-contains:
        - '"scope"'

  014 - update client grant with allow-any-organization on deny usage should fail:
    command: auth0 client-grants update $(./test/integration/scripts/get-client-grant-id.sh) --organization-usage deny --allow-any-organization=true --no-input
    exit-code: 1
    stderr:
      contains:
        - "--allow-any-organization can only be enabled when --organization-usage is 'allow' or 'require'"

  015 - list client grant organizations:
    command: auth0 client-grants organizations list $(./test/integration/scripts/get-client-grant-id.sh) --no-input
    exit-code: 0

  016 - list client grant organizations with invalid number:
    command: auth0 client-grants organizations list $(./test/integration/scripts/get-client-grant-id.sh) --number 1001 --no-input
    exit-code: 1
    stderr:
      contains:
        - number flag invalid, please pass a number between 1 and 1000

  016a - list client grant organizations rejects json and csv together:
    command: auth0 client-grants organizations list $(./test/integration/scripts/get-client-grant-id.sh) --json --csv --no-input
    exit-code: 1
    stderr:
      contains:
        - "any flags in the group [json json-compact csv] are set none of the others can be"

  017 - delete client grant:
    command: auth0 client-grants delete $(./test/integration/scripts/get-client-grant-id.sh) --force --no-input
    exit-code: 0

  018 - delete client grant with invalid id:
    command: auth0 client-grants delete this-client-grant-id-does-not-exist --force --no-input
    exit-code: 1
    stderr:
      contains:
        - "Failed to delete client grant with ID \"this-client-grant-id-does-not-exist\""

  017 - create client grant with neither client-id nor default-for should fail:
    command: auth0 client-grants create --audience $(./test/integration/scripts/get-api-identifier.sh) --no-input
    exit-code: 1
    stderr:
      contains:
        - "of --client-id or --default-for must be set"

  018 - create client grant with both client-id and default-for should fail:
    command: auth0 client-grants create --client-id $(./test/integration/scripts/get-m2m-app-id.sh) --default-for third_party_clients --audience $(./test/integration/scripts/get-api-identifier.sh) --no-input
    exit-code: 1
    stderr:
      contains:
        - "[client-id default-for]"

  019 - create default client grant with organization usage should fail:
    command: auth0 client-grants create --default-for third_party_clients --audience $(./test/integration/scripts/get-api-identifier.sh) --organization-usage allow --no-input
    exit-code: 1
    stderr:
      contains:
        - "--organization-usage cannot be set with --default-for"

  020 - create default client grant and check json output:
    command: auth0 client-grants create --default-for third_party_clients --audience $(./test/integration/scripts/get-api-identifier.sh) --scopes read:todos --json --no-input
    exit-code: 0
    stdout:
      json:
        audience: http://integration-test-api-client-grant
        default_for: third_party_clients

  021 - delete default client grant:
    command: auth0 client-grants delete $(auth0 client-grants list --default-for third_party_clients --audience $(./test/integration/scripts/get-api-identifier.sh) --json --no-input | jq -r '.[0].id') --force --no-input
    exit-code: 0
